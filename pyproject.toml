[project]
name = "rxbridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]
# Real extractor (RXBRIDGE_EXTRACTOR=nicrron); the stub needs none of these.
nicrron = ["pillow>=11", "numpy>=2", "httpx>=0.27,<1", "python-dotenv>=1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
